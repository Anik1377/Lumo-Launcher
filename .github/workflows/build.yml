name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run unit tests (Phase 0 harness)
        run: dotnet test src/Lumo.Tests/Lumo.Tests.csproj -c Release

      - name: Publish (single-file, win-x64)
        run: dotnet publish src/Lumo/Lumo.csproj -c Release

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'dev-' + $env:GITHUB_SHA.Substring(0,7) }
          $pub = 'src/Lumo/bin/Release/net8.0-windows/win-x64/publish'
          New-Item -ItemType Directory -Path 'stage/Lumo' -Force | Out-Null
          New-Item -ItemType Directory -Path 'stage/Lumo/runtimes' -Force | Out-Null
          Copy-Item "$pub/Lumo.exe" 'stage/Lumo/'
          # v2.6.0-alpha.7 — the whisper.cpp natives ship as real files:
          # Whisper.net 1.9.1 probes ONLY runtimes/win-x64 next to the exe and
          # never sees single-file self-extract temp copies. The publish tree
          # also carries win-arm64/win-x86 natives this x64-only app can't use,
          # so just the win-x64 folder goes into the zip.
          Copy-Item "$pub/runtimes/win-x64" 'stage/Lumo/runtimes/' -Recurse
          Copy-Item 'packaging/README.txt' 'stage/Lumo/'
          Compress-Archive -Path 'stage/Lumo' -DestinationPath "Lumo-launcher-$tag.zip"
          Add-Content $env:GITHUB_ENV "ZIP_NAME=Lumo-launcher-$tag.zip"

      - name: Build installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # v3.0 — a real installer next to the portable zip. Inno Setup compiles
          # packaging/installer.iss into a per-user setup exe (no admin, installs to
          # %LOCALAPPDATA%\Programs\Lumo, start-menu + optional desktop shortcuts,
          # uninstaller included). Only runs on tag builds — dev branches ship the zip.
          choco install innosetup -y --no-progress
          $tag = $env:GITHUB_REF_NAME
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$tag" "packaging/installer.iss"
          $setup = Get-ChildItem 'installer-output' -Filter 'LumoSetup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'installer exe was not produced' }
          Add-Content $env:GITHUB_ENV "SETUP_NAME=$($setup.Name)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-windows-x64-portable
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-windows-x64-installer
          path: installer-output/${{ env.SETUP_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            installer-output/${{ env.SETUP_NAME }}
          generate_release_notes: true
          prerelease: true
          name: "Lumo ${{ github.ref_name }} — ALPHA (unstable)"
          body: |
            > ⚠️ **ALPHA BUILD — UNSTABLE.** Lumo is in alpha: expect bugs and
            > breaking changes. Please report issues on the tracker.
